- insert:
    - id: dsh-context-bridge
      name: 'dsh-context-bridge'
      config:
        # 自动交接：监听 session/event 的 turn/end，跑满 handoffRounds 轮（默认 15）强制交接。
        # 项目开关与阈值见 <项目>/.dsh-bridge.json（每次判断前重读，改值下一轮生效，不用重启）。
        # 未声明 inject：服务一律 ctx.get 兜底，只挂两条 HTTP 路由 + 一个 session/event 监听。
        enabled: true
